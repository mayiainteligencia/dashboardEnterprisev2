<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Gradiente dorado premium -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD700" />
      <stop offset="50%" stop-color="#FFA500" />
      <stop offset="100%" stop-color="#FF8C00" />
    </linearGradient>
    <!-- Brillo sutil para nodos -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Fondo Transparente / Círculo contenedor sutil -->
  <circle cx="100" cy="100" r="90" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.3"/>

  <!-- Red de Inteligencia Artificial (Nodos y Conexiones) -->
  <g stroke="#FFC000" stroke-width="1" opacity="0.6">
    <line x1="100" y1="40" x2="60" y2="75" />
    <line x1="100" y1="40" x2="140" y2="75" />
    <line x1="60" y1="75" x2="60" y2="125" />
    <line x1="140" y1="75" x2="140" y2="125" />
    <line x1="60" y1="125" x2="100" y2="160" />
    <line x1="140" y1="125" x2="100" y2="160" />
    <!-- Conexiones internas cruzadas -->
    <line x1="100" y1="40" x2="100" y2="160" />
    <line x1="60" y1="75" x2="140" y2="125" />
    <line x1="140" y1="75" x2="60" y2="125" />
  </g>

  <!-- Nodos de la Red con Brillo Dorado -->
  <circle cx="100" cy="40" r="6" fill="url(#goldGrad)" filter="url(#glow)"/>
  <circle cx="60" cy="75" r="5" fill="url(#goldGrad)"/>
  <circle cx="140" cy="75" r="5" fill="url(#goldGrad)"/>
  <circle cx="60" cy="125" r="5" fill="url(#goldGrad)"/>
  <circle cx="140" cy="125" r="5" fill="url(#goldGrad)"/>
  <circle cx="100" cy="160" r="6" fill="url(#goldGrad)" filter="url(#glow)"/>
  
  <!-- Nodo Central (Fusión humana y tecnológica) -->
  <circle cx="100" cy="100" r="15" fill="#020B1C" stroke="url(#goldGrad)" stroke-width="3" filter="url(#glow)"/>
  
  <!-- Siglas WAI en el Centro -->
  <text x="100" y="105" 
        font-family="'Inter', -apple-system, sans-serif" 
        font-size="11" 
        font-weight="bold" 
        fill="#FFFFFF" 
        text-anchor="middle" 
        letter-spacing="0.5">WAI</text>

  <!-- Anillo orbital exterior decorativo -->
  <path d="M 30,100 A 70,70 0 0,1 170,100" fill="none" stroke="#FF4081" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
</svg>
